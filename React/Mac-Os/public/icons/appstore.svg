<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appstore_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="22" ry="22" fill="url(#appstore_bg)"/>
  
  <!-- A Triangle Structure -->
  <g transform="translate(50, 52)" stroke="white" stroke-width="8" stroke-linecap="round">
