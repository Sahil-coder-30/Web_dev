     <!-- Refined A -->
     <path d="M -22 15 L 0 -25 L 22 15" stroke="white" stroke-width="7" fill="none" opacity="0.4"/>
     <path d="M -22 15 L -8 15" stroke="white" stroke-width="7" />
     <path d="M 8 15 L 22 15" stroke="white" stroke-width="7" />
     <path d="M -11 -5 L 11 -5" stroke="white" stroke-width="7" />
  </g>
  <!-- Simpler A -->
