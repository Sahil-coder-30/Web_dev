<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="preview_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5" />
      <stop offset="100%" style="stop-color:#1976D2" />
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="22" ry="22" fill="url(#preview_grad)"/>
  
  <!-- Photo Mockup -->
  <rect x="25" y="25" width="50" height="40" fill="white" rx="2" opacity="0.9" />
  <rect x="28" y="28" width="44" height="34" fill="#CE93D8" rx="1" /> <!-- Purpleish image -->
  <circle cx="50" cy="45" r="8" fill="#FFF" opacity="0.5" />
  
  <!-- Loupe over it -->
  <g transform="translate(10, 10)">
    <circle cx="55" cy="55" r="16" fill="none" stroke="white" stroke-width="6" />
    <circle cx="55" cy="55" r="16" fill="white" opacity="0.2" /> <!-- Glass lens -->
    <line x1="66" y1="66" x2="78" y2="78" stroke="white" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
