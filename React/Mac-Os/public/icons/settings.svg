<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="settings_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0BEC5" />
      <stop offset="100%" style="stop-color:#78909C" />
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="22" ry="22" fill="url(#settings_grad)"/>
  
  <!-- Multiple Gears for Complexity/Realism -->
  <g fill="#455A64">
    <!-- Main Gear -->
    <path d="M 50 20 L 55 10 H 45 L 50 20 Z" transform="rotate(0, 50, 50)" />
    <path d="M 50 20 L 55 10 H 45 L 50 20 Z" transform="rotate(45, 50, 50)" />
    <path d="M 50 20 L 55 10 H 45 L 50 20 Z" transform="rotate(90, 50, 50)" />
    <path d="M 50 20 L 55 10 H 45 L 50 20 Z" transform="rotate(135, 50, 50)" />
    <path d="M 50 20 L 55 10 H 45 L 50 20 Z" transform="rotate(180, 50, 50)" />
    <path d="M 50 20 L 55 10 H 45 L 50 20 Z" transform="rotate(225, 50, 50)" />
    <path d="M 50 20 L 55 10 H 45 L 50 20 Z" transform="rotate(270, 50, 50)" />
    <path d="M 50 20 L 55 10 H 45 L 50 20 Z" transform="rotate(315, 50, 50)" />
    
    <circle cx="50" cy="50" r="28" fill="#546E7A" stroke="#37474F" stroke-width="2"/>
    <circle cx="50" cy="50" r="10" fill="#263238" />
  </g>
</svg>
