<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="5" y="5" width="90" height="90" rx="22" ry="22" fill="#FFC107"/>
  
  <!-- Map Grid -->
  <rect x="15" y="15" width="70" height="70" fill="#FFECB3" rx="10" />
  
  <!-- Roads -->
  <line x1="30" y1="15" x2="30" y2="85" stroke="white" stroke-width="10" />
  <line x1="70" y1="15" x2="70" y2="85" stroke="white" stroke-width="10" />
  <line x1="15" y1="50" x2="85" y2="50" stroke="white" stroke-width="10" />
  
  <!-- Location Pin -->
  <circle cx="50" cy="50" r="12" fill="#F44336" stroke="#D32F2F" stroke-width="2" />
  <circle cx="50" cy="50" r="4" fill="white" />
  
  <!-- Navigation Arrow -->
  <path d="M 70 20 L 85 15 L 80 30 Z" fill="#2979FF" />
</svg>
