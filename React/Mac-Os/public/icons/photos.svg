<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="5" y="5" width="90" height="90" rx="22" ry="22" fill="white"/>
  
  <!-- Flower - Making it BIGGER -->
  <g transform="translate(50,50) scale(1.3)">
    <!-- 8 Petals representing spectrum -->
    <ellipse cx="0" cy="-20" rx="8" ry="18" fill="#FF9800" /> <!-- Top Orange -->
    <ellipse cx="14" cy="-14" rx="8" ry="18" fill="#E91E63" transform="rotate(45)" /> <!-- Pink -->
    <ellipse cx="20" cy="0" rx="8" ry="18" fill="#9C27B0" transform="rotate(90)" /> <!-- Purple -->
    <ellipse cx="14" cy="14" rx="8" ry="18" fill="#2196F3" transform="rotate(135)" /> <!-- Blue -->
    <ellipse cx="0" cy="20" rx="8" ry="18" fill="#4CAF50" transform="rotate(180)" /> <!-- Green -->
    <ellipse cx="-14" cy="14" rx="8" ry="18" fill="#8BC34A" transform="rotate(225)" /> <!-- Light Green -->
    <ellipse cx="-20" cy="0" rx="8" ry="18" fill="#FFEB3B" transform="rotate(270)" /> <!-- Yellow -->
    <ellipse cx="-14" cy="-14" rx="8" ry="18" fill="#FFC107" transform="rotate(315)" /> <!-- Amber -->
  </g>
</svg>
